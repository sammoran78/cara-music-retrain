$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
command: >-
  python musicgen_lm_cara_trainer.py
  --token_cache_dir ${{inputs.token_cache_dir}}
  --output_dir ${{outputs.output_dir}}
  --encodec_manifest_relative_path manifest.encodec.jsonl
  --checkpoint ${{inputs.checkpoint}}
  --variant ${{inputs.variant}}
  --run_name ${{inputs.run_name}}
  --max_steps ${{inputs.max_steps}}
  --batch_size ${{inputs.batch_size}}
  --learning_rate ${{inputs.learning_rate}}
  --attribution_loss_weight ${{inputs.attribution_loss_weight}}
  --max_train_files ${{inputs.max_train_files}}
  --max_eval_files ${{inputs.max_eval_files}}
  --max_token_frames ${{inputs.max_token_frames}}
  --min_encodec_frames ${{inputs.min_encodec_frames}}
  --checkpoint_every ${{inputs.checkpoint_every}}
  --model_dtype ${{inputs.model_dtype}}
  --preflight_only false
  --dashboard_triggered ${{inputs.dashboard_triggered}}
  --dry_run ${{inputs.dry_run}}
code: ../../src
inputs:
  token_cache_dir:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/prepared/cara-strong-v0.4/musicgen_encodec_cache/
  checkpoint: facebook/musicgen-small
  variant: no_cara_baseline
  run_name: cara-musicgen-smoke
  max_steps: 250
  batch_size: 2
  learning_rate: 1e-5
  attribution_loss_weight: 0.05
  max_train_files: 2048
  max_eval_files: 512
  max_token_frames: 512
  min_encodec_frames: 2
  checkpoint_every: 250
  model_dtype: float32
  dashboard_triggered: "false"
  dry_run: "false"
outputs:
  output_dir:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/musicgen_smoke/
environment: azureml:env-musicgen-audiocraft:3
compute: azureml:gpu-smoke-h100
identity:
  type: user_identity
experiment_name: cara-musicgen-smoke
display_name: 08-smoke-musicgen-ar-trainer
description: GPU-only real MusicGen LM smoke trainer over cached EnCodec tokens with matched CARA evidence variants.
tags:
  cara_phase: fine-tuning
  cara_step_id: "08"
  cara_step_name: 08_smoke_musicgen_ar_trainer
  cara_compute_class: gpu
  cara_model_family: musicgen
  cara_training_scope: smoke
  cara_variant: no_cara_baseline
  cara_min_encodec_frames: "2"
  cara_output_path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/musicgen_smoke/
