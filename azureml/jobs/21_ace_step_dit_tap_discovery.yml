$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
command: >-
  python ace_step_hybrid_stages.py
  --stage dit_tap_discovery
  --ace_tensor_dir ${{inputs.ace_tensor_dir}}
  --output_dir ${{outputs.output_dir}}
  --tensor_manifest_relative_path ${{inputs.tensor_manifest_relative_path}}
  --checkpoint ${{inputs.checkpoint}}
  --planner_checkpoint ${{inputs.planner_checkpoint}}
  --dit_variant ${{inputs.dit_variant}}
  --load_checkpoint ${{inputs.load_checkpoint}}
  --max_rows ${{inputs.max_rows}}
  --dashboard_triggered ${{inputs.dashboard_triggered}}
  --dry_run ${{inputs.dry_run}}
code: ../../src
inputs:
  ace_tensor_dir:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/tensors/
  tensor_manifest_relative_path: ace_tensor_manifest.jsonl
  checkpoint: ACE-Step/Ace-Step1.5
  planner_checkpoint: ACE-Step/acestep-5Hz-lm-0.6B
  dit_variant: base_or_sft_dit
  load_checkpoint: "false"
  max_rows: 1024
  dashboard_triggered: "false"
  dry_run: "false"
outputs:
  output_dir:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/dit_taps/
environment: azureml:env-ace-step:5
compute: azureml:gpu-smoke-h100
identity:
  type: user_identity
experiment_name: cara-ace-step-smoke
display_name: 21-ace-step-dit-tap-discovery
description: GPU-only ACE-Step DiT tap discovery and import/checkpoint probe before Hybrid attribution-head smoke tests.
tags:
  cara_phase: fine-tuning
  cara_step_id: "05"
  cara_step_name: 05_ace_step_dit_tap_discovery
  cara_compute_class: gpu
  cara_model_family: ace_step
  cara_planner_size: 0.6B
  cara_training_gate: ace_step_dit_tap_discovery
  cara_training_scope: tap-discovery
  cara_cost_guardrail: existing_azureml_workspace_only
  cara_output_path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/dit_taps/
