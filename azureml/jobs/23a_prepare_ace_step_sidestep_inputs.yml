$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
command: >-
  python ace_step_hybrid_stages.py
  --stage prepare_sidestep_inputs
  --input_data ${{inputs.input_data}}
  --ace_tensor_dir ${{inputs.ace_tensor_dir}}
  --checkpoint ${{inputs.checkpoint}}
  --planner_checkpoint ${{inputs.planner_checkpoint}}
  --dit_variant ${{inputs.dit_variant}}
  --checkpoint_output_dir ${{outputs.checkpoint_output_dir}}
  --sidestep_tensor_output_dir ${{outputs.sidestep_tensor_output_dir}}
  --output_dir ${{outputs.output_dir}}
  --allow_checkpoint_download ${{inputs.allow_checkpoint_download}}
  --model_variant ${{inputs.model_variant}}
  --max_rows ${{inputs.max_rows}}
  --dashboard_triggered ${{inputs.dashboard_triggered}}
  --dry_run ${{inputs.dry_run}}
code: ../../src
inputs:
  input_data:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/finetune-subset/
  ace_tensor_dir:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/tensors/
  checkpoint: ACE-Step/Ace-Step1.5
  planner_checkpoint: ACE-Step/acestep-5Hz-lm-0.6B
  dit_variant: turbo_dit
  allow_checkpoint_download: "true"
  model_variant: turbo
  max_rows: 0
  dashboard_triggered: "false"
  dry_run: "false"
outputs:
  checkpoint_output_dir:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/checkpoints/
  sidestep_tensor_output_dir:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/tensors/sidestep_tensors/
  output_dir:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/sidestep_input_prep/
environment: azureml:env-ace-step-sidestep:3
compute: azureml:gpu-smoke-h100
identity:
  type: user_identity
experiment_name: cara-ace-step-smoke
display_name: 23a-prepare-ace-step-sidestep-inputs
description: Materialize ACE-Step checkpoint bundle and run Side-Step preprocessing into mounted tensor inputs before the full Hybrid Side-Step LoRA fine-tune.
tags:
  cara_phase: fine-tuning
  cara_step_id: "12a"
  cara_step_name: 12a_prepare_ace_step_sidestep_inputs
  cara_compute_class: gpu
  cara_model_family: ace_step
  cara_planner_size: 0.6B
  cara_training_gate: ace_step_sidestep_inputs
  cara_training_scope: sidestep-input-prep
  cara_cost_guardrail: existing_azureml_workspace_only
  cara_checkpoint_output_path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/checkpoints/
  cara_sidestep_tensor_output_path: azureml://datastores/ds_cara_raw_audio/paths/training-runs/cara-strong-v0.4/ace_step/tensors/sidestep_tensors/
