$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
command: >-
  python stableaudio_env_test.py
  --input_data ${{inputs.input_data}}
  --output_dir ${{outputs.output_dir}}
  --dashboard_triggered ${{inputs.dashboard_triggered}}
code: ../../src
inputs:
  input_data:
    type: uri_folder
    path: azureml://datastores/ds_cara_raw_audio/paths/test-audio/
  dashboard_triggered: "false"
outputs:
  output_dir:
    type: uri_folder
environment: azureml:env-stable-audio-tools:8
compute: azureml:gpu-smoke-h100
identity:
  type: user_identity
experiment_name: cara-test-prep
display_name: 04-stableaudio-env-test
description: Verify Stable Audio Tools installation and shared dataset visibility.
tags:
  cara_phase: test-prep
  cara_test_id: "04"
  cara_test_name: 04_stableaudio_env_test
  cara_compute_class: gpu-smoke
  cara_model_family: stable_audio_open_small
